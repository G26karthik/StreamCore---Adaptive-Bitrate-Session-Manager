name: Software Testing CI Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Check 1: Unit Testing on Bitrate Quality Level Constraints
  unit-test-bitrate:
    name: "1. Unit Test - Bitrate Quality Specifications"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run BitrateLevel Unit Tests
        run: mvn test -Dtest=BitrateLevelTest

  # Check 2: Unit Testing on Viewer Session Domain Model
  unit-test-session:
    name: "2. Unit Test - Viewer Session Lifecycle & State"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run ViewerSession Unit Tests
        run: mvn test -Dtest=ViewerSessionTest

  # Check 3: Component / Subsystem Testing on In-Memory LRU Cache
  component-test-cache:
    name: "3. Component Test - LRU Cache Eviction & Hit Rates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run ChunkMetadataCache Component Tests
        run: mvn test -Dtest=ChunkMetadataCacheTest

  # Check 4: Behavioral & Integration Testing on ABR Decision Engine
  behavioral-test-abr:
    name: "4. Behavioral Test - ABR Hysteresis Decision Engine"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run AbrDecisionEngine Behavioral Tests
        run: mvn test -Dtest=AbrDecisionEngineTest
